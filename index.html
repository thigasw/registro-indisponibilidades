<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Coelho Tecnologia</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="shortcut icon" href="favco.png" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="header-brand">
        <img src="assets/LOGO.png" alt="Coelho Tecnologia" class="logo">
        <div class="header-text">
          <span class="header-label">NOC — Monitoramento</span>
          <h1>Registro de Indisponibilidade</h1>
        </div>
      </div>
      <div class="header-actions">
        <a href="dashboard.html" class="btn btn-secondary">
          <span class="btn-icon">📊</span> Dashboard
        </a>
        <button id="addRecordBtn" class="btn btn-primary">
          <span class="btn-icon">+</span> Novo Registro
        </button>
        <button class="btn btn-secondary" onclick="exportarCSV()">
          <span class="btn-icon">↓</span> Exportar CSV
        </button>
      </div>
    </div>
  </header>

  <section class="filter-section">
    <div class="filter-inner">
      <div class="filter-group">
        <label class="filter-label" for="filterCircuito">Circuito</label>
        <select id="filterCircuito" class="filter-select" onchange="renderizarTabela()">
          <option value="">Todos os circuitos</option>
        </select>
      </div>
      <div class="filter-group">
        <label class="filter-label" for="filterStatus">Status</label>
        <select id="filterStatus" class="filter-select" onchange="renderizarTabela()">
          <option value="">Todos</option>
          <option value="Concluído">Concluído</option>
          <option value="Em Aberto">Em Aberto</option>
        </select>
      </div>
      <div class="filter-group">
        <label class="filter-label" for="filterData">Data</label>
        <input type="date" id="filterData" class="filter-input" onchange="renderizarTabela()" title="Filtrar por data de início">
      </div>
      <div class="filter-group filter-group--wide">
        <label class="filter-label" for="filterProtocolo">Protocolo</label>
        <input type="text" id="filterProtocolo" class="filter-input" placeholder="Buscar protocolo..." onkeyup="renderizarTabela()">
      </div>
      <button class="btn-limpar" onclick="limparFiltros()" title="Limpar filtros">✕ Limpar</button>
    </div>
  </section>

  <main class="main-content">
    <div class="table-wrapper">
      <table class="registro-table">
        <thead>
          <tr>
            <th>Circuito</th>
            <th>Status</th>
            <th>Prot. Operadora</th>
            <th>Prot. Coelho</th>
            <th>Início</th>
            <th>Fim</th>
            <th>Tempo Total</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="registroTableBody"></tbody>
      </table>
    </div>
    <div class="table-footer" id="tableFooter"></div>
  </main>

  <div id="modalRegistro" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modalTitulo">Novo Registro de Indisponibilidade</h3>
        <button class="modal-close" id="closeModal" aria-label="Fechar">✕</button>
      </div>

      <form id="formRegistro" class="modal-form">

        <div class="form-row">
          <div class="form-group form-group--full">
            <label class="form-label" for="inputCircuito">Circuito <span class="required">*</span></label>
            <select id="inputCircuito" class="form-control" required>
              <option value="" disabled selected>Selecione o circuito</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="inputStatus">Status <span class="required">*</span></label>
            <select id="inputStatus" class="form-control" required>
              <option value="Em Aberto">Em Aberto</option>
              <option value="Concluído">Concluído</option>
            </select>
          </div>
        </div>

        <div class="form-row form-row--2col">
          <div class="form-group">
            <label class="form-label" for="inputProtOperadora">Protocolo Operadora</label>
            <input type="text" id="inputProtOperadora" class="form-control" placeholder="Ex: TESADIP351465">
          </div>
          <div class="form-group">
            <label class="form-label" for="inputProtCoelho">Protocolo Coelho</label>
            <input type="text" id="inputProtCoelho" class="form-control" placeholder="Ex: CHT-20241201">
          </div>
        </div>

        <div class="form-row form-row--2col">
          <div class="form-group">
            <label class="form-label" for="inputInicio">Início da Queda <span class="required">*</span></label>
            <input type="datetime-local" id="inputInicio" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="inputFim">Previsão / Retorno <span class="required">*</span></label>
            <input type="datetime-local" id="inputFim" class="form-control" required>
          </div>
        </div>
        <div class="tempo-preview" id="tempoPreviewBox">
          <span class="tempo-icon">⏱</span>
          <span id="previewTempo">Preencha início e fim para calcular</span>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="closeModalBtn">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar Registro</button>
        </div>

      </form>
    </div>
  </div>

  <script src="script/script.js"></script>
</body>
</html>
