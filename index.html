<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Indisponibilidade dos Circuitos</title>
</head>
<body>
   <header>
    <img src="assets/LOGO.png" alt="logo coelho" width="200">
    <h1>Registro - Indisponibilidade dos Circuitos</h1>
   </header>
   <div class="controls">
    <button id="addRecordBtn">Adicionar Registro</button>
    <button id="exportCsvBtn">Exportar para CSV</button>
   </div>
   <div class="table_container">
    <table>
        <thead class="table_content">
            <tr>
                <th>Circuito</th>
                <th>Status</th>
                <th>Protocolo - Operadora</th>
                <th>Protocolo - Coelho</th>
                <th>Data</th>
                <th>Horário - Início</th>
                <th>Horário - Fim</th>
                <th>Tempo total de Indisponibilidade</th>
            </tr>
        </thead>
        <tbody id="registroTableBody">
            <!-- As linhas da tabela serão inseridas aqui pelo JavaScript -->
        </tbody>
    </table>

   </div>

   
</body>
</html>
